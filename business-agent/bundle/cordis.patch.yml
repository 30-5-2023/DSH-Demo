# Business work-order additions applied after the base and Web bundle layers.
- id: ui-sidebar-terminal
  disabled: true

- id: ui-sidebar-files
  disabled: true

- insert:
    - id: business-workorder-host
      name: '@deepseek-ai/dsh-business-workorder-host'
      config:
        serviceUrl: http://127.0.0.1:8090
        maxConsecutiveWakes: 3
        reconnectInitialDelayMs: 500
        reconnectMaxDelayMs: 10000

    - id: business-workorder-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: workorder
        transport: streamable-http
        url: http://127.0.0.1:8090/mcp
        failOnStartupError: true

    - id: business-workorder-ui
      name: '@deepseek-ai/dsh-business-workorder-ui'
      config:
        serviceUrl: http://127.0.0.1:8090
        orderId: WO-MVP-001

    - id: business-workorder-debug
      name: '@deepseek-ai/dsh-business-workorder-debug'
      config:
        serviceUrl: http://127.0.0.1:8090
        orderId: WO-MVP-001
        traceLimit: 100

    - id: business-a2a-bridge
      name: '@deepseek-ai/dsh-business-a2a-bridge'
      config:
        route: /a2a
        listener:
          host: !!js process.env.A2A_LISTEN_HOST ?? '127.0.0.1'
          port: !!js Number(process.env.A2A_LISTEN_PORT ?? 3082)
        publicBaseUrl: !!js process.env.A2A_PUBLIC_BASE_URL
        agent:
          name: Business Agent
          description: Internal business workflow agent
          version: 0.1.0
          defaultInputModes: [text/plain, application/json]
          defaultOutputModes: [text/plain, application/json]
          skills:
            - id: business-workflows
              name: Business Workflows
              description: Handle configured internal business workflows
              tags: [business]
        requestTimeoutMs: 300000
        outboundTimeoutMs: 300000
        maxRequestBytes: 1048576
        maxResponseBytes: 4194304
        maxConcurrentContexts: 16
