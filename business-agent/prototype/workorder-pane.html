<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工单作业页 · 布局原型</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   这是右侧「工单作业页」的纯前端布局原型，不接 DSH、不接业务系统。
   视觉全部取自底座真实 token（packages/client/ui-theme/src/styles/）：同一套
   --dsw-* 变量、同一套 14px/15px/13px 字号阶梯、同一套 0.5px 描边与圆角。
   目的是让你确认「接进右栏之后长什么样」，而不是看一张示意图。
   ───────────────────────────────────────────────────────────────────────── */

/* 底座静态色阶（浅色/深色同值，直接照抄 design-platform.css） */
:root {
  --dsw-static-amber-100: rgb(254, 245, 231);
  --dsw-static-amber-400: rgb(247, 173, 49);
  --dsw-static-amber-600: rgb(221, 134, 41);
  --dsw-static-blue-300: rgb(147, 197, 253);
  --dsw-static-blue-500: rgb(59, 130, 246);
  --dsw-static-blue-600: rgb(37, 99, 235);
  --dsw-static-green-100: rgb(230, 250, 237);
  --dsw-static-green-400: rgb(78, 209, 126);
  --dsw-static-green-500: rgb(34, 197, 94);
  --dsw-static-neutral-bluish-50: rgb(249, 250, 251);
  --dsw-static-neutral-bluish-100: rgb(235, 238, 242);
  --dsw-static-neutral-bluish-300: rgb(207, 211, 214);
  --dsw-static-neutral-bluish-700: rgb(97, 102, 107);
  --dsw-static-neutral-bluish-1000: rgb(15, 17, 21);
  --dsw-static-red-400: rgb(242, 90, 90);
}
/* 底座语义别名 */
:root {
  --dsw-alias-bg-base: rgb(255, 255, 255);
  --dsw-alias-bg-layer-2: rgb(255, 255, 255);
  --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
  --dsw-alias-border-l3: rgba(0, 0, 0, 0.12);
  --dsw-alias-border-l4: rgba(0, 0, 0, 0.16);
  --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
  --dsw-alias-interactive-bg-active: rgba(38, 49, 72, 0.1);
  --dsw-alias-label-primary: rgb(15, 17, 21);
  --dsw-alias-label-secondary: rgb(97, 102, 107);
  --dsw-alias-label-tertiary: rgb(129, 133, 140);
  --dsw-alias-label-caption: rgb(173, 178, 184);
  --dsw-alias-state-business-primary: rgb(65, 118, 230);
  --dsw-alias-state-success-primary: rgb(34, 197, 94);
  --dsw-alias-state-success-tertiary: rgb(230, 250, 237);
  --dsw-alias-state-warn-primary: rgb(245, 158, 11);
  --dsw-alias-state-warn-tertiary: rgb(254, 245, 231);
  --dsw-alias-state-error-primary: rgb(236, 19, 19);
  --dsw-alias-state-error-secondary: rgb(242, 90, 90);
  --dsw-alias-button-primary-fill: rgb(15, 17, 21);
  --dsw-alias-button-primary-hover: rgb(67, 69, 74);
  --dsw-alias-label-primary-foreground: rgb(255, 255, 255);
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --ds-font-family-code: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ds-transition-duration: 0.2s;
}
body[data-ds-dark-theme] {
  --dsw-alias-bg-base: rgb(21, 21, 23);
  --dsw-alias-bg-layer-2: rgb(44, 44, 46);
  --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
  --dsw-alias-border-l3: rgba(255, 255, 255, 0.16);
  --dsw-alias-border-l4: rgba(255, 255, 255, 0.2);
  --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
  --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.14);
  --dsw-alias-label-primary: rgb(249, 250, 251);
  --dsw-alias-label-secondary: rgb(207, 211, 214);
  --dsw-alias-label-tertiary: rgb(173, 178, 184);
  --dsw-alias-label-caption: rgb(129, 133, 140);
  --dsw-alias-state-business-primary: rgb(103, 158, 254);
  --dsw-alias-state-success-primary: rgb(78, 209, 126);
  --dsw-alias-state-success-tertiary: rgb(35, 60, 44);
  --dsw-alias-state-warn-tertiary: rgb(39, 36, 31);
  --dsw-alias-state-error-primary: rgb(242, 90, 90);
  --dsw-alias-state-error-secondary: rgb(242, 90, 90);
  --dsw-alias-button-primary-fill: rgb(249, 250, 251);
  --dsw-alias-button-primary-hover: rgb(235, 238, 242);
  --dsw-alias-label-primary-foreground: rgb(15, 17, 21);
}

/* 原型自有的四个语义位：活动类型的色相。
   用 color-mix 从底座色阶派生，不写死新颜色 —— 生产代码里这一段会换成
   ui-theme 的语义别名。 */
:root {
  --wo-tool-bg: color-mix(in srgb, var(--dsw-static-blue-500) 12%, transparent);
  --wo-tool-ink: var(--dsw-static-blue-600);
  --wo-agent-bg: color-mix(in srgb, var(--dsw-static-amber-400) 22%, transparent);
  --wo-agent-ink: var(--dsw-static-amber-600);
  --wo-manual-bg: color-mix(in srgb, var(--dsw-alias-label-tertiary) 14%, transparent);
  --wo-manual-ink: var(--dsw-static-neutral-bluish-700);
  --wo-qc-bg: color-mix(in srgb, var(--dsw-static-green-500) 16%, transparent);
  --wo-qc-ink: color-mix(in srgb, var(--dsw-static-green-500) 72%, var(--dsw-static-neutral-bluish-1000));
}
body[data-ds-dark-theme] {
  --wo-tool-ink: var(--dsw-static-blue-300);
  --wo-agent-ink: var(--dsw-static-amber-400);
  --wo-manual-ink: var(--dsw-static-neutral-bluish-300);
  --wo-qc-ink: var(--dsw-static-green-400);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 13px;
  line-height: 1.5;
  background: var(--dsw-alias-bg-base);
  -webkit-font-smoothing: antialiased;
}

/* ── 演示外壳：只服务于原型，不属于工单页本身 ─────────────────────────── */

.stage { display: flex; flex-direction: column; height: 100vh; }

.stage-bar {
  display: flex;
  flex: none;
  flex-wrap: wrap;
  gap: 18px;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--dsw-alias-border-l2);
}

.stage-group { display: flex; gap: 4px; align-items: center; }

.stage-label {
  margin-right: 4px;
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
}

.stage-hint { margin-left: auto; color: var(--dsw-alias-label-caption); font-size: 12px; }

.stage-btn {
  padding: 4px 11px;
  color: var(--dsw-alias-label-secondary);
  font: inherit;
  font-size: 12px;
  background: transparent;
  border: 0.5px solid var(--dsw-alias-border-l3);
  border-radius: 999px;
  cursor: pointer;
  transition: background var(--ds-transition-duration) var(--ds-ease-in-out);
}

.stage-btn:hover { background: var(--dsw-alias-interactive-bg-hover); }

.stage-btn[aria-pressed='true'] {
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-interactive-bg-active);
  border-color: var(--dsw-alias-border-l4);
}

.stage-body { display: flex; flex: 1; min-height: 0; }

/* 左侧对话页是宽度参照物，不做任何真实渲染。 */
.sim-chat {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  justify-content: center;
  min-width: 0;
  color: var(--dsw-alias-label-caption);
  font-size: 12px;
  background: var(--dsw-alias-bg-base);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0 9px,
    color-mix(in srgb, var(--dsw-alias-label-tertiary) 7%, transparent) 9px 10px
  );
}

/* ── 右侧栏本体：从这里往下才是「工单作业页」的真实结构 ───────────────── */

.sim-pane {
  display: flex;
  flex: none;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  /* 面板取对话区的地色，不做抬升卡片 —— 底座 Sidebar 的既有约定。 */
  background: var(--dsw-alias-bg-base);
  border-left: 0.5px solid var(--dsw-alias-border-l3);
}

/* 页头 38px，与底座文件树/文档预览的 header 同高同描边。 */
.pane-header {
  display: flex;
  flex: none;
  gap: 6px;
  align-items: center;
  height: 38px;
  padding: 0 6px 0 14px;
  border-bottom: 0.5px solid var(--dsw-alias-border-l3);
}

.order-picker {
  display: flex;
  flex: 1 1 auto;
  gap: 6px;
  align-items: baseline;
  min-width: 0;
  padding: 3px 6px;
  color: inherit;
  font: inherit;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.order-picker:hover { background: var(--dsw-alias-interactive-bg-hover); }

.order-title {
  overflow: hidden;
  font-size: 13px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.order-id {
  flex: none;
  color: var(--dsw-alias-label-tertiary);
  font-family: var(--ds-font-family-code);
  font-size: 11px;
}

.pane-tool {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  border: 0;
  border-radius: 28px;
  cursor: pointer;
}

.pane-tool:hover {
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-interactive-bg-hover);
}

/* 作业区 : 交付件区 = 3 : 1 */
.zone-work {
  display: flex;
  flex: 3 1 0;
  flex-direction: column;
  min-height: 0;
}

.zone-deliverables {
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  min-height: 0;
}

.zone-split { flex: none; height: 1px; background: var(--dsw-alias-border-l3); }

/* 作业区内部的两个页签用分段控件，不是底座的 dock 标签。 */
.segmented {
  display: flex;
  flex: none;
  gap: 2px;
  margin: 8px 12px 4px;
  padding: 2px;
  background: color-mix(in srgb, var(--dsw-alias-label-tertiary) 10%, transparent);
  border-radius: 9px;
}

.segment {
  flex: 1 1 0;
  padding: 4px 10px;
  color: var(--dsw-alias-label-secondary);
  font: inherit;
  font-size: 12px;
  background: transparent;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
  transition: background var(--ds-transition-duration-fast) var(--ds-ease-in-out);
}

.segment:hover { color: var(--dsw-alias-label-primary); }

.segment[aria-selected='true'] {
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-2);
  box-shadow: 0 1px 2px color-mix(in srgb, var(--dsw-alias-label-primary) 12%, transparent);
}

.zone-title {
  display: flex;
  flex: none;
  gap: 6px;
  align-items: baseline;
  padding: 8px 14px 4px;
  color: var(--dsw-alias-label-secondary);
  font-size: 12px;
}

.zone-count { color: var(--dsw-alias-label-caption); font-variant-numeric: tabular-nums; }

/* 滚动区：沿用底座右栏的 2px 条边距与 8px 内缩。 */
.scroll {
  flex: 1 1 auto;
  min-height: 0;
  margin-right: 2px;
  padding: 2px 0 10px;
  overflow: auto;
  scrollbar-gutter: stable;
}

.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--dsw-alias-label-tertiary) 32%, transparent);
  border-radius: 4px;
}
.scroll::-webkit-scrollbar-track { margin: 2px; }

/* ── 作业记录：产线 ───────────────────────────────────────────────────── */

.pipeline { margin: 0; padding: 8px 10px 12px; list-style: none; }

.node {
  display: grid;
  grid-template-columns: 24px 1fr;
  column-gap: 8px;
  animation: node-in 0.34s var(--ds-ease-in-out) both;
}

/* 卡片之间的间距放在卡片自己的上外边距上，而不是节点之间 —— 节点带了外边距，
   导轨那格就不会跟着长高，竖线会在每两张卡片之间断开。 */
.node:not(:first-child) .card { margin-top: 8px; }

@keyframes node-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

/* 左侧导轨：把活动串成一条产线。 */
.rail { position: relative; display: flex; justify-content: center; }

.rail::before {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  /* 显式居中：不依赖「绝对定位子元素按 flex 对齐属性取静态位置」这条规范行为 */
  left: calc(50% - 0.75px);
  width: 1.5px;
  background: var(--dsw-alias-border-l3);
}

/* 线止于首/末节点的圆心（圆心 = 卡片上内边距 8px + 标题行半高 10px = 行顶下 18px）。 */
.node:first-child .rail::before { top: 18px; }
.node:last-child .rail::before { bottom: calc(100% - 18px); }

.node[data-status='done'] .rail::before { background: var(--dsw-alias-state-success-primary); }
.node[data-status='failed'] .rail::before { background: var(--dsw-alias-state-error-secondary); }

.node-dot {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: flex-start;
  width: 26px;
  height: 26px;
  margin-top: 5px;
  color: var(--dsw-alias-label-tertiary);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  background: var(--dsw-alias-bg-base);
  border: 1px solid var(--dsw-alias-border-l4);
  border-radius: 999px;
}

.node[data-status='done'] .node-dot {
  color: var(--dsw-alias-state-success-primary);
  background: var(--dsw-alias-state-success-tertiary);
  border-color: color-mix(in srgb, var(--dsw-alias-state-success-primary) 45%, transparent);
}

.node[data-status='running'] .node-dot {
  color: var(--dsw-alias-state-business-primary);
  border: 2px solid var(--dsw-alias-state-business-primary);
}

.node[data-status='failed'] .node-dot {
  color: var(--dsw-alias-state-error-primary);
  background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 12%, transparent);
  border-color: color-mix(in srgb, var(--dsw-alias-state-error-primary) 45%, transparent);
}

/* 进行中的节点有一圈呼吸环，是全页唯一持续动效。 */
.node[data-status='running'] .node-dot::after {
  content: '';
  position: absolute;
  inset: -4px;
  border: 1.5px solid var(--dsw-alias-state-business-primary);
  border-radius: 999px;
  animation: pulse 1.9s var(--ds-ease-in-out) infinite;
}

@keyframes pulse {
  0% { opacity: 0.5; transform: scale(0.92); }
  70% { opacity: 0; transform: scale(1.16); }
  100% { opacity: 0; transform: scale(1.16); }
}

/* 活动卡片：0.5px 轮廓 + 12px 圆角，与右栏既有的胶囊/行同一种描边。
   底不抬升（仍是对话区的地色），靠轮廓把每张卡片分开。 */
.card {
  padding: 8px;
  background: var(--dsw-alias-bg-base);
  border: 0.5px solid var(--dsw-alias-border-l3);
  border-radius: 12px;
  transition: border-color var(--ds-transition-duration) var(--ds-ease-in-out);
}

.card:hover { border-color: var(--dsw-alias-border-l4); }

.card-head { display: flex; gap: 6px; align-items: center; }

.badge {
  flex: none;
  padding: 1px 7px;
  font-size: 11px;
  line-height: 1.6;
  border-radius: 6px;
}

.badge[data-type='tool'] { color: var(--wo-tool-ink); background: var(--wo-tool-bg); }
.badge[data-type='agent'] { color: var(--wo-agent-ink); background: var(--wo-agent-bg); }
.badge[data-type='manual'] { color: var(--wo-manual-ink); background: var(--wo-manual-bg); }
.badge[data-type='inspection'] { color: var(--wo-qc-ink); background: var(--wo-qc-bg); }

.card-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  font-size: 13px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.node[data-status='pending'] .card-title { color: var(--dsw-alias-label-secondary); }
.node[data-status='done'] .card-title { color: var(--dsw-alias-label-primary); }

.status {
  display: flex;
  flex: none;
  gap: 4px;
  align-items: center;
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
}

.status::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: currentColor;
}

.status[data-status='done'] { color: var(--dsw-alias-state-success-primary); }
.status[data-status='running'] { color: var(--dsw-alias-state-business-primary); }
.status[data-status='failed'] { color: var(--dsw-alias-state-error-primary); }

/* 「等待人工」是这张页面唯一需要用户做事的活动状态，给它警示色。
   与「待开始」区分开：待开始是还没轮到，等待人工是轮到它了但没人推。 */
.status[data-status='waiting'] { color: var(--dsw-alias-state-warn-primary); }

.card-meta {
  display: flex;
  gap: 5px;
  align-items: center;
  margin-top: 3px;
  overflow: hidden;
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
  white-space: nowrap;
}

.card-meta-text { overflow: hidden; text-overflow: ellipsis; }

.card-meta code { font-family: var(--ds-font-family-code); font-size: 11px; }

/* 自动化标记：产线是否自己把这一步跑掉，与活动类型是两件事（工具活动也能配成
   需人工确认，手工活动也能配成自动），所以必须单独显示，不能靠类型徽章推断。 */
.auto-mark {
  display: inline-flex;
  flex: none;
  gap: 3px;
  align-items: center;
  padding: 0 5px;
  font-size: 10px;
  line-height: 1.7;
  border-radius: 5px;
}

.auto-mark[data-automation='auto'] {
  color: var(--dsw-alias-label-secondary);
  background: color-mix(in srgb, var(--dsw-alias-label-tertiary) 12%, transparent);
}

.auto-mark[data-automation='manual'] {
  color: var(--dsw-alias-state-warn-label);
  background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 16%, transparent);
}

/* 输入件 → 输出件：一行放不下就换行，箭头始终夹在两组之间。 */
.files {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  align-items: center;
  margin-top: 6px;
  font-size: 12px;
}

/* 标签与它的胶囊同组换行：「输出」不会留在上一行而把胶囊甩到下一行。 */
.files-group {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  min-width: 0;
}

.files-label { color: var(--dsw-alias-label-caption); font-size: 10px; }

.chip {
  display: inline-flex;
  gap: 3px;
  align-items: center;
  max-width: 100%;
  padding: 1px 6px;
  color: var(--dsw-alias-label-secondary);
  background: color-mix(in srgb, var(--dsw-alias-label-tertiary) 10%, transparent);
  border-radius: 6px;
}

.chip-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chip[data-output] { color: var(--dsw-alias-label-primary); }

/* 输入件的来源：这个件取自上游第几步的输出。
   输入是上游输出的绑定而不是产线一开始写死的清单，所以来源必须看得见。 */
.chip-from {
  flex: none;
  color: var(--dsw-alias-label-caption);
  font-size: 10px;
}

.chip-from::before { content: '←'; margin-right: 1px; }

.arrow { color: var(--dsw-alias-label-caption); }

.failure {
  margin-top: 6px;
  padding: 6px 8px;
  color: var(--dsw-alias-state-error-primary);
  font-size: 12px;
  background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 8%, transparent);
  border-radius: 8px;
}

/* 异常之后谁来收场：页面没有按钮，所以原因下面必须写清去处。 */
.failure-hint {
  margin-top: 3px;
  color: var(--dsw-alias-label-secondary);
  font-size: 11px;
}

/* 作业区底部的驱动提示：这张页面没有任何写入口，产线靠左侧对话推进，
   所以必须留一句把入口指回去的话。它是常驻条，不随产线滚走。
   用块级排版而不是 flex —— 内容是「文字 + <b> + <code>」混排，
   当成 flex 项会逐段断行。 */
.drive-hint {
  flex: none;
  margin: 0 10px 8px;
  padding: 6px 9px;
  color: var(--dsw-alias-label-tertiary);
  font-size: 11px;
  line-height: 1.5;
  background: color-mix(in srgb, var(--dsw-alias-label-tertiary) 8%, transparent);
  border-radius: 8px;
}

.drive-hint b {
  color: var(--dsw-alias-label-secondary);
  font-weight: 500;
}

.drive-hint code {
  color: var(--dsw-alias-label-secondary);
  font-family: var(--ds-font-family-code);
}

.btn {
  padding: 3px 11px;
  color: var(--dsw-alias-label-secondary);
  font: inherit;
  font-size: 12px;
  background: transparent;
  border: 0.5px solid var(--dsw-alias-border-l3);
  border-radius: 999px;
  cursor: pointer;
  transition: background var(--ds-transition-duration-fast) var(--ds-ease-in-out);
}

.btn:hover { background: var(--dsw-alias-interactive-bg-hover); }

.btn[data-variant='primary'] {
  color: var(--dsw-alias-label-primary-foreground);
  background: var(--dsw-alias-button-primary-fill);
  border-color: transparent;
}

.btn[data-variant='primary']:hover { background: var(--dsw-alias-button-primary-hover); }

.btn[data-variant='danger'] { color: var(--dsw-alias-state-error-primary); }

/* 当前活动：轮廓换成强调色并给一层极淡的底。
   卡片有了自己的轮廓之后，外面那道竖条就不需要了 —— 轮廓本身就能承担标记。 */
.node[data-current] .card {
  background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 5%, var(--dsw-alias-bg-base));
  border-color: color-mix(in srgb, var(--dsw-alias-state-business-primary) 55%, transparent);
}

.node[data-status='failed'][data-current] .card {
  background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 5%, var(--dsw-alias-bg-base));
  border-color: color-mix(in srgb, var(--dsw-alias-state-error-primary) 55%, transparent);
}

/* ── 决策记录：只读时间线 ─────────────────────────────────────────────── */

.timeline { margin: 0; padding: 6px 14px 0; list-style: none; }

.decision {
  display: grid;
  grid-template-columns: 42px 1fr;
  column-gap: 10px;
  padding: 6px 0;
  animation: node-in 0.3s var(--ds-ease-in-out) both;
}

.decision + .decision { border-top: 0.5px solid var(--dsw-alias-border-l2); }

.decision-time {
  color: var(--dsw-alias-label-caption);
  font-family: var(--ds-font-family-code);
  font-size: 11px;
  line-height: 1.8;
}

.decision-head { display: flex; gap: 6px; align-items: baseline; }

.decision-actor { flex: none; font-size: 12px; }

.decision-action {
  flex: none;
  padding: 0 6px;
  font-size: 11px;
  line-height: 1.7;
  border-radius: 5px;
}

.decision-action[data-tone='ok'] {
  color: var(--dsw-alias-state-success-primary);
  background: var(--dsw-alias-state-success-tertiary);
}

.decision-action[data-tone='run'] {
  color: var(--dsw-alias-state-business-primary);
  background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 12%, transparent);
}

.decision-action[data-tone='bad'] {
  color: var(--dsw-alias-state-error-primary);
  background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 12%, transparent);
}

.decision-action[data-tone='plain'] {
  color: var(--dsw-alias-label-secondary);
  background: color-mix(in srgb, var(--dsw-alias-label-tertiary) 12%, transparent);
}

.decision-target {
  overflow: hidden;
  color: var(--dsw-alias-label-secondary);
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.decision-note {
  margin-top: 2px;
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
}

/* ── 交付件区 ─────────────────────────────────────────────────────────── */

.deliverables { margin: 0; padding: 0 12px 4px; list-style: none; }

.deliverable {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 5px 8px;
  border-radius: 8px;
  cursor: pointer;
}

.deliverable:hover { background: var(--dsw-alias-interactive-bg-hover); }

.deliverable-glyph {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  color: var(--dsw-alias-label-tertiary);
  background: color-mix(in srgb, var(--dsw-alias-label-tertiary) 12%, transparent);
  border-radius: 5px;
  font-size: 10px;
}

.deliverable-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.deliverable-from {
  flex: none;
  color: var(--dsw-alias-label-caption);
  font-size: 11px;
}

/* ── 三种非正常态 ─────────────────────────────────────────────────────── */

.placeholder {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

.placeholder-glyph {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  margin-bottom: 4px;
  color: var(--dsw-alias-label-caption);
  background: color-mix(in srgb, var(--dsw-alias-label-tertiary) 10%, transparent);
  border-radius: 999px;
}

.placeholder-title { font-size: 13px; }

.placeholder-body {
  max-width: 260px;
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
}

.placeholder[data-tone='error'] .placeholder-glyph {
  color: var(--dsw-alias-state-error-primary);
  background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 12%, transparent);
}

.placeholder code {
  font-family: var(--ds-font-family-code);
  font-size: 11px;
  word-break: break-all;
}

.skeleton { padding: 4px 14px; }

.skeleton-row {
  height: 34px;
  margin-bottom: 8px;
  background: var(--dsw-alias-interactive-bg-hover);
  border-radius: 8px;
  animation: breathe 1.4s var(--ds-ease-in-out) infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 0.25; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="stage">
  <header class="stage-bar">
    <div class="stage-group">
      <span class="stage-label">右栏宽度</span>
      <button class="stage-btn" type="button" data-width="340">340</button>
      <button class="stage-btn" type="button" data-width="400" aria-pressed="true">400</button>
      <button class="stage-btn" type="button" data-width="480">480</button>
    </div>
    <div class="stage-group">
      <span class="stage-label">主题</span>
      <button class="stage-btn" type="button" data-theme="light" aria-pressed="true">浅色</button>
      <button class="stage-btn" type="button" data-theme="dark">深色</button>
    </div>
    <div class="stage-group">
      <span class="stage-label">页面状态</span>
      <button class="stage-btn" type="button" data-state="ready" aria-pressed="true">正常</button>
      <button class="stage-btn" type="button" data-state="failed">活动异常</button>
      <button class="stage-btn" type="button" data-state="empty">空态</button>
      <button class="stage-btn" type="button" data-state="error">接口失败</button>
    </div>
    <div class="stage-group">
      <span class="stage-label">模拟</span>
      <button class="stage-btn" type="button" data-sim="auto" title="只驱动标记为自动的活动；轮到人工活动时产线会停住">产线自动推进</button>
      <button class="stage-btn" type="button" data-sim="dialogue" title="等待人工的活动：第一次让人开口开始，第二次报告完成">对话推进当前步</button>
      <button class="stage-btn" type="button" data-sim="fail">执行失败</button>
    </div>
    <div class="stage-group">
      <span class="stage-label">交付件区</span>
      <button class="stage-btn" type="button" data-split="quarter" aria-pressed="true">1/4</button>
      <button class="stage-btn" type="button" data-split="third">1/3</button>
    </div>
    <span class="stage-hint">左侧斜纹区只是宽度参照 · 按钮均可点，操作会即时改变状态</span>
  </header>

  <div class="stage-body">
    <section class="sim-chat" aria-hidden="true">
      左侧对话页保持不变
    </section>

    <section class="sim-pane" id="pane" style="width: 400px" aria-label="工单作业页">
      <div class="pane-header">
        <button class="order-picker" type="button" id="orderPicker">
          <span class="order-title" id="orderTitle"></span>
          <span class="order-id" id="orderId"></span>
          <span aria-hidden="true" style="color: var(--dsw-alias-label-caption)">▾</span>
        </button>
        <button class="pane-tool" type="button" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.97M13.5 2.5V5H11" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="zone-work" id="zoneWork">
        <div class="segmented" role="tablist" aria-label="作业区视图">
          <button class="segment" type="button" role="tab" id="tab-record" aria-selected="true" aria-controls="view-record">作业记录</button>
          <button class="segment" type="button" role="tab" id="tab-decision" aria-selected="false" aria-controls="view-decision">决策记录</button>
        </div>
        <div class="scroll" id="view-record" role="tabpanel" aria-labelledby="tab-record"></div>
        <div class="scroll" id="view-decision" role="tabpanel" aria-labelledby="tab-decision" hidden></div>
        <p class="drive-hint" id="driveHint"></p>
      </div>

      <div class="zone-split" aria-hidden="true"></div>

      <div class="zone-deliverables">
        <div class="zone-title">
          交付件
          <span class="zone-count" id="deliverableCount"></span>
        </div>
        <div class="scroll" id="view-deliverables"></div>
      </div>
    </section>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   原型专用视图数据，不等同于服务响应字段。
   接真实系统时由 /orders/:id、/orders/:id/decisions 与 /events 适配得到。
   ───────────────────────────────────────────────────────────────────────── */

const BASE_ORDER = {
  id: 'WO-2026-0916-014',
  title: '客户 A 年度授信复核',
  currentActivityId: 'a2',
  activities: [
    {
      id: 'a1', seq: 1, type: 'tool', automation: 'auto', title: '拉取客户主数据', status: 'done',
      assignee: 'http.fetchCustomerMaster', startedAt: '13:58', finishedAt: '14:02',
      inputs: [{ name: '工单基本信息', kind: 'record' }],
      outputs: [{ name: 'customer-master.json', kind: 'file' }],
    },
    {
      id: 'a2', seq: 2, type: 'agent', automation: 'auto', title: '生成授信分析报告', status: 'running',
      assignee: '标准模式 · 本会话', startedAt: '14:02',
      inputs: [{ name: 'customer-master.json', kind: 'file', from: 1 }],
      outputs: [],
    },
    {
      id: 'a3', seq: 3, type: 'manual', automation: 'manual', title: '复核财报口径', status: 'pending',
      assignee: '张三',
      inputs: [{ name: '授信分析报告.md', kind: 'file', from: 2 }, { name: '2025 年报.pdf', kind: 'file' }],
      outputs: [],
    },
    {
      id: 'a4', seq: 4, type: 'inspection', automation: 'manual', title: '合规终审', status: 'pending',
      assignee: '合规岗',
      inputs: [{ name: '授信分析报告.md', kind: 'file', from: 2 }, { name: '复核结论.md', kind: 'file', from: 3 }],
      outputs: [],
    },
    {
      id: 'a5', seq: 5, type: 'tool', automation: 'auto', title: '归档至影像系统', status: 'pending',
      assignee: 'http.archive',
      inputs: [{ name: '授信分析报告.md', kind: 'file', from: 2 }, { name: '合规检查清单.md', kind: 'file', from: 4 }],
      outputs: [],
    },
  ],
  decisions: [
    { at: '14:02', actor: '产线', action: '开始', tone: 'run', target: '② 生成授信分析报告', note: '自动：输入已就绪（← ① customer-master.json）' },
    { at: '14:02', actor: '产线', action: '完成', tone: 'ok', target: '① 拉取客户主数据' },
    { at: '13:58', actor: '产线', action: '开始', tone: 'plain', target: '① 拉取客户主数据' },
  ],  deliverables: [
    { name: 'customer-master.json', kind: 'file', from: '① 拉取客户主数据', at: '14:02' },
  ],
};

/** 自动化活动跑挂时的样子：输入拿得到、执行失败，等人在对话里处置。 */
const AUTO_FAILURE = {
  activityId: 'a2',
  code: 'UPSTREAM_TIMEOUT',
  message: '调用分析服务超时（120s）。已重试 2 次仍失败，需人工确认是否更换数据源后重跑。',
};

const TYPE_LABEL = { tool: '工具', agent: 'agent', manual: '手工', inspection: '质检' };
const STATUS_LABEL = {
  pending: '待开始',
  waiting: '等待人工',
  running: '执行中',
  done: '已完成',
  failed: '异常',
};
const AUTOMATION_LABEL = { auto: '自动', manual: '需人工' };

/** 页面是只读看板：活动的推进由产线引擎自动完成，或由人在左侧对话里下达，
 *  所以这里没有任何操作按钮，只有一句随当前活动变化的去向提示。
 *  自动执行中的活动不需要人做任何事，提示条也就不该喊人。 */
function driveHintFor(order, state) {
  const current = order.activities.find(activity => activity.id === order.currentActivityId);
  if (current === undefined) return '';
  // 「活动异常」演示态只是在渲染时把某个活动画成失败，底层数据没变，
  // 提示条必须套用同一个覆盖，否则会喊着「自动执行中」而卡片是红的。
  const status = state === 'failed' && current.id === AUTO_FAILURE.activityId
    ? 'failed'
    : current.status;

  if (status === 'running' && current.automation === 'auto') {
    return `第 ${current.seq} 步由产线自动执行中 · 无需操作`;
  }
  if (status === 'failed') {
    return '第 ' + String(current.seq) + ' 步执行失败 · 在左侧对话里改完输入后说 '
      + `<code>「重跑第 ${current.seq} 步」</code> 或 <code>「继续执行第 ${current.seq} 步」</code>`;
  }
  if (status === 'waiting') {
    const ask = current.type === 'inspection'
      ? `给出第 ${current.seq} 步的质检结论`
      : `开始第 ${current.seq} 步`;
    return `第 ${current.seq} 步需人工 · 对 agent 说 <code>「${ask}」</code>`;
  }
  return `产线推进中 · 当前第 ${current.seq} 步`;
}

function chip(file, isOutput) {
  const glyph = file.kind === 'record' ? '▤' : file.kind === 'text' ? '¶' : '▦';
  // 输入件带来源：这条输入取自上游第几步的输出。绑定可以在异常处置时改，
  // 所以它必须显示出来，而不是被当成产线写死的清单。
  const from = !isOutput && file.from !== undefined
    ? `<span class="chip-from" title="来自第 ${file.from} 步的输出">${file.from}</span>`
    : '';
  return `<span class="chip"${isOutput ? ' data-output' : ''} title="${esc(file.name)}">`
    + from
    + `<span aria-hidden="true">${glyph}</span>`
    + `<span class="chip-name">${esc(file.name)}</span></span>`;
}

function filesRow(activity) {
  const parts = [];
  if (activity.inputs.length > 0) {
    parts.push('<span class="files-group"><span class="files-label">输入</span>'
      + activity.inputs.map(f => chip(f, false)).join('') + '</span>');
  }
  if (activity.outputs.length > 0) {
    // 箭头与输出组同组：换行时箭头领着下一行，而不是孤零零留在上一行末尾。
    const arrow = activity.inputs.length > 0 ? '<span class="arrow" aria-hidden="true">→</span>' : '';
    parts.push('<span class="files-group">' + arrow + '<span class="files-label">输出</span>'
      + activity.outputs.map(f => chip(f, true)).join('') + '</span>');
  }
  return parts.length === 0 ? '' : `<div class="files">${parts.join('')}</div>`;
}

function renderPipeline(order, state) {
  const items = order.activities.map((activity, index) => {
    const failed = state === 'failed' && activity.id === AUTO_FAILURE.activityId;
    const status = failed ? 'failed' : activity.status;
    const isCurrent = activity.id === order.currentActivityId;
    const timing = activity.startedAt
      ? `${esc(activity.startedAt)}${activity.finishedAt ? `–${esc(activity.finishedAt)}` : ' 起'}`
      : '';
    const meta = [
      `<span class="auto-mark" data-automation="${activity.automation}">`
        + `${AUTOMATION_LABEL[activity.automation]}</span>`,
      `<span class="card-meta-text">执行者 <code>${esc(activity.assignee)}</code>`
        + `${timing === '' ? '' : ` · ${timing}`}</span>`,
    ];

    const failure = failed ? AUTO_FAILURE : activity.failure;
    const failureBox = failure === undefined
      ? ''
      : '<div class="failure">'
        + `<strong>${esc(failure.code)}</strong> · ${esc(failure.message)}`
        + '<div class="failure-hint">在左侧对话里改完输入后说「重跑第 '
        + String(activity.seq) + ' 步」或「继续执行第 ' + String(activity.seq) + ' 步」</div>'
        + '</div>';

    return `<li class="node" data-status="${status}"${isCurrent ? ' data-current' : ''}`
      + ` style="animation-delay: ${index * 45}ms">`
      + '<div class="rail"><span class="node-dot">' + activity.seq + '</span></div>'
      + '<div class="card">'
      + '<div class="card-head">'
      + `<span class="badge" data-type="${activity.type}">${TYPE_LABEL[activity.type]}</span>`
      + `<span class="card-title">${esc(activity.title)}</span>`
      + `<span class="status" data-status="${status}">${STATUS_LABEL[status]}</span>`
      + '</div>'
      + `<div class="card-meta">${meta.join('')}</div>`
      + filesRow(activity)
      + failureBox
      + '</div></li>';
  });
  return `<ol class="pipeline">${items.join('')}</ol>`;
}

function renderDecisions(order) {
  const rows = order.decisions.map((decision, index) => `
    <li class="decision" style="animation-delay: ${index * 35}ms">
      <span class="decision-time">${esc(decision.at)}</span>
      <div>
        <div class="decision-head">
          <span class="decision-actor">${esc(decision.actor)}</span>
          <span class="decision-action" data-tone="${decision.tone}">${esc(decision.action)}</span>
          <span class="decision-target">${esc(decision.target)}</span>
        </div>
        ${decision.note
          ? `<div class="decision-note">${decision.quoted ? `「${esc(decision.note)}」` : esc(decision.note)}</div>`
          : ''}
      </div>
    </li>`);
  return `<ol class="timeline">${rows.join('')}</ol>`;
}

function renderDeliverables(order) {
  const glyph = { file: '▦', text: '¶', url: '↗', json: '{}', record: '▤' };
  return `<ul class="deliverables">${order.deliverables.map(deliverable => `
    <li class="deliverable" role="button" tabindex="0">
      <span class="deliverable-glyph" aria-hidden="true">${glyph[deliverable.kind] ?? '▦'}</span>
      <span class="deliverable-name" title="${esc(deliverable.name)}">${esc(deliverable.name)}</span>
      <span class="deliverable-from">${esc(deliverable.from)} · ${esc(deliverable.at)}</span>
    </li>`).join('')}</ul>`;
}

function placeholder(tone, glyph, title, body, action) {
  return `<div class="placeholder" data-tone="${tone}">
    <span class="placeholder-glyph" aria-hidden="true">${glyph}</span>
    <span class="placeholder-title">${title}</span>
    <span class="placeholder-body">${body}</span>
    ${action ? `<button class="btn" type="button" data-variant="primary" data-act="${action.act}">${action.label}</button>` : ''}
  </div>`;
}

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
function esc(value) {
  return String(value).replace(/[&<>"]/g, character => ESCAPES[character]);
}

/* ── 页面装配 ─────────────────────────────────────────────────────────── */

const pane = document.getElementById('pane');
const viewRecord = document.getElementById('view-record');
const viewDecision = document.getElementById('view-decision');
const viewDeliverables = document.getElementById('view-deliverables');

let order = structuredClone(BASE_ORDER);
let pageState = 'ready';
let activeTab = 'record';

function render() {
  document.getElementById('orderTitle').textContent = order.title;
  document.getElementById('orderId').textContent = order.id;

  if (pageState === 'error') {
    viewRecord.innerHTML = placeholder(
      'error', '⚠', '无法连接业务系统',
      '请求 <code>http://127.0.0.1:8090/orders/' + esc(order.id) + '</code> 失败：连接超时（10s）。',
      { act: 'retry-load', label: '重试' },
    );
    viewDecision.innerHTML = placeholder('plain', '·', '暂无记录', '业务系统恢复后这里会列出全部操作记录。');
    document.getElementById('driveHint').hidden = true;
    viewDeliverables.innerHTML = '';
    document.getElementById('deliverableCount').textContent = '';
    return;
  }

  if (pageState === 'empty') {
    viewRecord.innerHTML = placeholder(
      'plain', '☐', '还没有工单', '业务系统里没有分配给你的工单。演示模式下可以载入一条示例工单。',
      { act: 'load-sample', label: '载入示例工单' },
    );
    viewDecision.innerHTML = placeholder('plain', '·', '暂无记录', '这条工单还没有任何操作记录。');
    document.getElementById('driveHint').hidden = true;
    viewDeliverables.innerHTML = '';
    document.getElementById('deliverableCount').textContent = '';
    return;
  }

  viewRecord.innerHTML = renderPipeline(order, pageState);
  viewDecision.innerHTML = renderDecisions(order);
  viewDeliverables.innerHTML = renderDeliverables(order);
  document.getElementById('deliverableCount').textContent = `(${order.deliverables.length})`;
  const hint = document.getElementById('driveHint');
  hint.hidden = false;
  hint.innerHTML = driveHintFor(order, pageState);
}

/** 模拟一次产线推进。三种来源，对应三种真实驱动方：
 *  - `auto`     产线引擎自己跑完当前自动活动（actor=产线）
 *  - `dialogue` 人在对话里下达指令（actor=agent）
 *  - `fail`     当前活动执行失败，转人工处置
 *  真实实现里这些副作用都发生在宿主侧的 workorder 服务上，页面只是重新读一次。 */
function simulate(kind) {
  if (pageState === 'failed') pageState = 'ready';
  const activity = order.activities.find(item => item.id === order.currentActivityId);
  if (activity === undefined) return;

  if (kind === 'fail') {
    activity.status = 'failed';
    activity.failure = {
      code: 'UPSTREAM_TIMEOUT',
      message: '调用分析服务超时（120s）。已重试 2 次仍失败，需人工确认是否更换数据源后重跑。',
    };
    pushDecision(activity, '执行失败', 'bad', '产线引擎：UPSTREAM_TIMEOUT', '产线');
    render();
    return;
  }

  if (kind === 'dialogue') {
    if (activity.status === 'waiting') {
      // 人工活动：人开口之后才开始跑。
      activity.status = 'running';
      activity.startedAt = activity.startedAt ?? now();
      pushDecision(activity, '开始', 'run', `「开始第 ${activity.seq} 步」`, 'agent');
    } else if (activity.status === 'running' && activity.automation === 'manual') {
      // 人报告做完，这一格才结束。
      finishActivity(activity, 'agent');
    }
    render();
    return;
  }

  // 产线自动推进只驱动打了自动化标记的活动；轮到人工活动时产线会停在那里，
  // 这也正是「等待人工」这个状态存在的意义。
  if (kind === 'auto') {
    if (activity.automation !== 'auto') { render(); return; }
    finishActivity(activity, '产线');
    render();
  }
}

/** 完成一个活动：补输出件、落决策记录、把当前活动前移。 */
function finishActivity(activity, actor) {
  activity.status = 'done';
  delete activity.failure;
  activity.startedAt = activity.startedAt ?? now();
  activity.finishedAt = now();
  if (activity.outputs.length === 0) {
    activity.outputs = [{ name: `${activity.title}-产出.md`, kind: 'file' }];
    order.deliverables.unshift({
      name: activity.outputs[0].name, kind: 'file',
      from: `${circled(activity.seq)} ${activity.title}`, at: activity.finishedAt,
    });
  }
  pushDecision(activity, '完成', 'ok', undefined, actor);
  advanceCurrent(activity);
}

/** 当前活动 = 第一个还没结束的活动；轮到人工活动时把它标成「等待人工」，
 *  自动活动则直接被产线接走（演示里停在 running，等下一次点击跑完）。 */
function advanceCurrent(activity) {
  const next = order.activities.find(item => item.seq > activity.seq && item.status !== 'done');
  if (next === undefined) {
    order.currentActivityId = activity.id;
    return;
  }
  order.currentActivityId = next.id;
  if (next.automation === 'manual') {
    next.status = 'waiting';
  } else {
    next.status = 'running';
    next.startedAt = next.startedAt ?? now();
    pushDecision(next, '开始', 'plain', `自动：输入已就绪（${next.inputs.filter(f => f.from !== undefined).map(f => `← ${f.from}`).join(' ') || '工单材料'}）`, '产线');
  }
}

function pushDecision(activity, action, tone, note, actor) {
  const source = actor ?? 'agent';
  order.decisions.unshift({
    at: now(),
    actor: source,
    action,
    tone,
    target: `${circled(activity.seq)} ${activity.title}`,
    // 只有人通过对话下达的指令才带引号——机器写的说明不是谁说的话。
    ...(note === undefined ? {} : { note, quoted: source === 'agent' }),
  });
}

/** 演示用虚拟时钟：从 14:02 往后走，别让模拟出来的时间戳跳成真实系统时间。 */
let clockMinutes = 14 * 60 + 2;

/** 序号字符：交付件与决策记录里的「来自第几步」用圈码，和产线卡片上的圆点对得上。 */
const CIRCLED = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨'];
function circled(seq) {
  return CIRCLED[seq - 1] ?? String(seq);
}

function now() {
  const hours = String(Math.floor(clockMinutes / 60)).padStart(2, '0');
  const minutes = String(clockMinutes % 60).padStart(2, '0');
  clockMinutes += 3;
  return `${hours}:${minutes}`;
}

/* ── 交互绑定 ─────────────────────────────────────────────────────────── */

// 页面里只剩空态/失败态那两个占位按钮；活动卡片上没有任何写入口。
pane.addEventListener('click', (event) => {
  const button = event.target.closest('[data-act]');
  if (button === null) return;
  const act = button.dataset.act;

  if (act === 'retry-load') { pageState = 'ready'; render(); return; }
  if (act === 'load-sample') { order = structuredClone(BASE_ORDER); pageState = 'ready'; render(); }
});

// 演示外壳上的「模拟左侧对话」按钮，替代原来的卡片操作按钮。
for (const button of document.querySelectorAll('[data-sim]')) {
  button.addEventListener('click', () => { simulate(button.dataset.sim); });
}

for (const segment of document.querySelectorAll('.segment')) {
  segment.addEventListener('click', () => {
    activeTab = segment.id === 'tab-record' ? 'record' : 'decision';
    for (const other of document.querySelectorAll('.segment')) {
      other.setAttribute('aria-selected', String(other === segment));
    }
    viewRecord.hidden = activeTab !== 'record';
    viewDecision.hidden = activeTab !== 'decision';
  });
}

for (const button of document.querySelectorAll('[data-width]')) {
  button.addEventListener('click', () => {
    pane.style.width = `${button.dataset.width}px`;
    for (const other of document.querySelectorAll('[data-width]')) {
      other.setAttribute('aria-pressed', String(other === button));
    }
  });
}

for (const button of document.querySelectorAll('[data-theme]')) {
  button.addEventListener('click', () => {
    const dark = button.dataset.theme === 'dark';
    if (dark) document.body.setAttribute('data-ds-dark-theme', '');
    else document.body.removeAttribute('data-ds-dark-theme');
    for (const other of document.querySelectorAll('[data-theme]')) {
      other.setAttribute('aria-pressed', String(other === button));
    }
  });
}

for (const button of document.querySelectorAll('[data-state]')) {
  button.addEventListener('click', () => {
    pageState = button.dataset.state;
    if (pageState === 'ready' || pageState === 'failed') order = structuredClone(BASE_ORDER);
    for (const other of document.querySelectorAll('[data-state]')) {
      other.setAttribute('aria-pressed', String(other === button));
    }
    render();
  });
}

for (const button of document.querySelectorAll('[data-split]')) {
  button.addEventListener('click', () => {
    const ratio = button.dataset.split === 'third' ? '2 1 0' : '3 1 0';
    document.getElementById('zoneWork').style.flex = ratio;
    for (const other of document.querySelectorAll('[data-split]')) {
      other.setAttribute('aria-pressed', String(other === button));
    }
  });
}

render();
</script>
